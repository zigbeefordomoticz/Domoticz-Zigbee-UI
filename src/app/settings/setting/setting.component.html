@if (setting.Advanced === false || advanced === setting.Advanced) {
  <div [formGroupName]="setting.Name">
    @if (setting.DataType === 'str') {
      <div class="form-group row mt-2">
        <label for="current" translate="{{ setting.Name }}" class="col-sm-6 col-form-label"></label>
        <div class="col-sm">
          <input type="text" formControlName="current" class="w-100 form-control" />
        </div>
      </div>
    }
    @if (setting.DataType === 'path') {
      <div class="form-group row mt-2">
        <label for="current" translate="{{ setting.Name }}" class="col-sm-6 col-form-label"></label>
        <div class="col-sm">
          <input type="text" formControlName="current" class="w-100 form-control" />
        </div>
      </div>
    }
    @if (setting.DataType === 'int') {
      <div class="form-group row mt-2">
        <label for="current" translate="{{ setting.Name }}" class="col-sm-6 col-form-label"></label>
        <div class="col-sm">
          <input type="number" formControlName="current" class="w-50 form-control" />
        </div>
      </div>
    }
    @if (setting.DataType === 'hex') {
      <div class="form-group row mt-2">
        <label for="current" translate="{{ setting.Name }}" class="col-sm-6 col-form-label"></label>
        <div class="col-sm">
          <input type="text" formControlName="current" class="w-50 form-control" />
        </div>
      </div>
    }
    @if (setting.DataType === 'list') {
      <div class="form-group row mt-2">
        <label for="current" translate="{{ setting.Name }}" class="col-sm-6 col-form-label"></label>
        <div class="col-sm">
          <ng-select
            [items]="list"
            [compareWith]="compareNumeric"
            bindLabel="label"
            bindValue="value"
            [closeOnSelect]="true"
            formControlName="current">
          </ng-select>
        </div>
      </div>
    }
    @if (setting.DataType === 'bool') {
      <div class="form-check form-check-inline mt-2">
        <input formControlName="current" type="checkbox" class="form-check-input" id="{{ setting.Name }}" />
        <label class="form-check-label" for="{{ setting.Name }}" translate="{{ setting.Name }}"></label>
      </div>
    }
  </div>
}
