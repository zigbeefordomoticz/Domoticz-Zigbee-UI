<app-admin-tabs [active]="action"></app-admin-tabs>

@switch (action) {
  @case ('pairing') {
    <app-admin-provisioning></app-admin-provisioning>
  }
  @case ('group') {
    <div class="row row-cols-1 row-cols-xxl-5 row-cols-xl-4 row-cols-lg-3 row-cols-md-2 row-cols-sm-1 g-4">
      <app-rescan-group></app-rescan-group>
      <app-scan-group-device></app-scan-group-device>
    </div>
  }
  @case ('coordinator') {
    <div class="row row-cols-1 row-cols-xxl-5 row-cols-xl-4 row-cols-lg-3 row-cols-md-2 row-cols-sm-1 g-4">
      <app-sw-reset></app-sw-reset>
      <app-switch-channel></app-switch-channel>
    </div>
  }
  @default {
    <app-admin-plugin></app-admin-plugin>
  }
}
