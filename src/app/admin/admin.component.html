<app-admin-tabs [active]="action"></app-admin-tabs>

@switch (action) {
  @case ('pairing') {
    <app-admin-provisioning></app-admin-provisioning>
  }
  @case ('group') {
    <app-admin-groups></app-admin-groups>
  }
  @case ('coordinator') {
    <app-admin-coordinator></app-admin-coordinator>
  }
  @default {
    <app-admin-plugin></app-admin-plugin>
  }
}
