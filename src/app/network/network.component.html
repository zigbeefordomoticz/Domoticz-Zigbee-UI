<app-network-tabs #tabs [active]="view"></app-network-tabs>

@switch (view) {
  @case ('topology') {
    <app-topology></app-topology>
  }
  @case ('interference') {
    <app-network-interference (reportsChanged)="tabs.refreshInterference()"></app-network-interference>
  }
  @default {
    <app-mesh></app-mesh>
  }
}
