@switch (i18nService.language) {
  @case ('fr-FR') {
    <app-about-fr></app-about-fr>
  }
  @case ('nl-NL') {
    <app-about-nl></app-about-nl>
  }
  @case ('es-ES') {
    <app-about-es></app-about-es>
  }
  @case ('de-DE') {
    <app-about-de></app-about-de>
  }
  @case ('it-IT') {
    <app-about-it></app-about-it>
  }
  @default {
    <app-about-en></app-about-en>
  }
}
