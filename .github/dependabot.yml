# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      # Security updates arrive one PR per advisory unless they are grouped.
      # That is how this repository once accumulated 35 open PRs, nearly all of
      # them transitive build-time dependencies. Collapse them into a single PR.
      #
      # There is deliberately no exclude-patterns and no ignore block any more.
      # Both existed because Angular was pinned at 17.3 and Dependabot kept
      # proposing Angular hoists that could not install; the history is in the
      # closing comments on #247, #250 and #255 if it is ever needed. The
      # Angular 17 -> 21 upgrade removed the reason, so the suppression went
      # with it.
      #
      # The group forms normally again, and it does raise PRs. #264 appeared
      # within minutes of the upgrade reaching beta.
      #
      # Expect those PRs to be red until Angular 22. The remaining advisories
      # are development-scope and most trace back to braces, whose latest
      # release (3.0.3) is itself the vulnerable one, so there is nothing to
      # offer for those -- `npm audit fix` clears zero. Where a fix path does
      # exist it runs through @angular-devkit/build-angular 22, which cannot
      # install against Angular 21. #264 was exactly that: a one-line bump of
      # build-angular from 21.2.26 to 22.2.2, failing npm ci with ERESOLVE.
      #
      # Note it arrives through THIS group, not the `angular` version-update
      # group below, because Dependabot reaches it as a security fix.
      #
      # Do not suppress it. It is honest signal: ngx-toastr has no Angular 22
      # release (its latest peers @angular/core ^21.0.0), so Angular cannot move
      # yet, and this is the reminder that doing so is the next step. Close the
      # PR when it appears. See the Angular section of CLAUDE.md.
      #
      # This is the same shape as the pre-upgrade problem but a far smaller one:
      # one package bumped rather than five, and no fan-out into per-advisory
      # PRs, because nothing is excluded from the group any more.
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

      # Angular and its satellites move as one unit; a PR that bumps part of the
      # toolchain on its own cannot build.
      angular:
        applies-to: version-updates
        patterns:
          - '@angular*'

      npm-development:
        applies-to: version-updates
        dependency-type: 'development'

      npm-production:
        applies-to: version-updates
        dependency-type: 'production'
