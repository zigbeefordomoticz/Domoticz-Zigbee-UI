# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: weekly

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      # Security updates arrive one PR per advisory unless they are grouped.
      # That is how this repository once accumulated 35 open PRs, nearly all of
      # them transitive build-time dependencies. Collapse them into a single PR.
      #
      # There is deliberately no exclude-patterns and no ignore block any more.
      # Both existed because Angular was pinned at 17.3 and Dependabot kept
      # proposing Angular hoists that could not install; the history is in the
      # closing comments on #247, #250 and #255 if it is ever needed. The
      # Angular 17 -> 21 upgrade removed the reason, so the suppression went
      # with it.
      #
      # The group can therefore form normally again. It will currently still
      # produce nothing, but for an upstream reason rather than a self-inflicted
      # one: every remaining advisory traces back to braces, whose latest
      # release (3.0.3) is itself the vulnerable one, so no fix exists to offer.
      # `npm audit fix` reshuffles the lockfile and clears zero advisories.
      #
      # Expect a red Angular 22 version-update PR in the `angular` group below.
      # That is honest signal, not a bug: ngx-toastr has no Angular 22 release
      # (its latest peers @angular/core ^21.0.0), so Angular cannot move yet.
      # Do not suppress it -- it is the reminder that this is the next step. See
      # the Angular section of CLAUDE.md.
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

      # Angular and its satellites move as one unit; a PR that bumps part of the
      # toolchain on its own cannot build.
      angular:
        applies-to: version-updates
        patterns:
          - '@angular*'

      npm-development:
        applies-to: version-updates
        dependency-type: 'development'

      npm-production:
        applies-to: version-updates
        dependency-type: 'production'
