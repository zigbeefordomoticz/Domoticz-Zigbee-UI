name: Build

on:
  push:
    branches: beta
  pull_request:
    branches: beta

# Let a newer run supersede an in-flight one, but never cancel a push to beta:
# that run is the one that deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/beta') }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # contents: write is needed by the Deploy step to push to gh-pages. On a
    # pull request from a fork GitHub forces the token read-only regardless,
    # and the Deploy step does not run on pull requests at all.
    permissions:
      contents: write
    strategy:
      matrix:
        node-version:
          # Angular 21 requires ^20.19.0 || ^22.12.0 || >=24.0.0, and Node 20
          # reached end of life on 2026-04-30.
          - 22
    steps:
      - uses: actions/checkout@v4

      - name: Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: npm ci
        run: npm ci --ignore-scripts

      - name: npm run lint
        run: npm run lint

      - name: npm run build prod
        run: npm run build

      # Keep the build, on every run. A pull request builds the same dist the
      # deploy would publish -- same command, same Node, same runner -- and
      # until now threw it away, so the only way to get a CI-built bundle in
      # front of a running plugin was to merge to beta, which is also the
      # publish. Uploading it makes a pull request testable against real
      # hardware without deploying anything to gh-pages.
      #
      # This matters more than it looks: a locally built dist is not
      # comparable to this one. On a different Node the toolchain still
      # builds, but emits different main.js and runtime.js. See the note in
      # CLAUDE.md and the correction on #246.
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.number || github.sha }}
          path: dist
          retention-days: 14
          # A dist that built into nothing should fail here, not quietly
          # produce an empty artifact somebody then deploys.
          if-no-files-found: error

      # Deploy only from a push to beta. A pull request builds and lints, and
      # stops here. dist is already on disk from the step above, so this is the
      # same deploy the workflow has always done.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
